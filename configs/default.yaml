# Base configuration. Every ablation row in the README is this file plus a small set
# of dotted-path overrides (see src/ragmed/eval/ablation.py) - never a code change.
#
# `paths` is deliberately omitted so it resolves relative to the repo root on any
# machine.

corpus:
  # Five clinical topics chosen to stress different retrieval failure modes:
  # drug names and dosages (exact-match, favours BM25), mechanism questions
  # (paraphrase, favours dense), and guideline thresholds (numeric, favours both).
  pubmed_queries:
    - "type 2 diabetes management guideline[Title/Abstract]"
    - "heart failure with preserved ejection fraction treatment"
    - "community acquired pneumonia antibiotic therapy adult"
    - "atrial fibrillation anticoagulation stroke prevention"
    - "chronic kidney disease progression management"
  max_per_query: 400
  require_abstract: true
  tool: ragmed

chunking:
  # Structure-aware: split on section boundaries (BACKGROUND / METHODS / RESULTS /
  # CONCLUSIONS in structured abstracts) before packing to size. The `fixed`
  # alternative is an ablation row, not dead code.
  strategy: structure
  target_tokens: 512
  overlap_tokens: 64
  min_tokens: 32

retrieval:
  bm25:
    enabled: true
    k1: 1.2
    b: 0.75
    top_k: 50
    use_stopwords: true

  dense:
    enabled: true
    # 33M params, 384-dim. Chosen because torch here is CPU-only; swap for
    # BAAI/bge-base-en-v1.5 or bge-m3 if you install a CUDA build.
    model: BAAI/bge-small-en-v1.5
    query_prefix: "Represent this sentence for searching relevant passages: "
    passage_prefix: ""
    top_k: 50
    batch_size: 32
    device: auto
    normalize: true

  fusion:
    method: rrf
    k: 60

  rerank:
    enabled: true
    # 22M param cross-encoder. Small enough to be honest about on CPU while still
    # showing the real accuracy/latency tradeoff a bigger reranker would amplify.
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    top_n: 5
    candidates: 50
    batch_size: 16
    device: auto

  rewrite:
    # Off by default: it costs an LLM round trip on every query and the ablation
    # is what decides whether that is worth paying for.
    enabled: false
    max_queries: 3

  assembly:
    max_context_tokens: 3000
    dedup_threshold: 0.92
    ordering: edges

generation:
  provider: ollama
  # 3B/q4 is ~2GB and fits entirely in this machine's 4GB card. An 8B at q4 is
  # ~4.7GB, which spills to CPU and makes a golden-set build take hours. Raise this
  # on a larger card - and see the README's caveat about a 3B model as LLM-judge.
  model: llama3.2:3b
  host: http://localhost:11434
  temperature: 0.0
  max_tokens: 800
  timeout_s: 300.0
  require_citations: true

judge:
  provider: ollama
  model: llama3.2:3b
  host: http://localhost:11434
  temperature: 0.0
  timeout_s: 300.0
  # Point this at hand-labelled examples to measure how far the judge can be trusted.
  human_labels: null

eval:
  k_values: [1, 3, 5, 10, 20]
  ndcg_k: 10
  # CI build gates. A config or prompt change that drops below these fails the build.
  min_recall_at_10: 0.80
  min_ndcg_at_10: 0.60
  min_faithfulness: 0.70
  # Calibrated for CUDA torch on a GTX 1650, where measured p95 retrieval is 758ms
  # (718ms of it the cross-encoder). 1500 leaves ~2x headroom so ordinary variance
  # does not flake the build while a genuine regression still trips it.
  # On CPU-only torch the same config measures 8087ms p95 — raise this to ~12000
  # there, or the gate fails on every run and stops meaning anything.
  max_p95_latency_ms: 1500.0

service:
  host: 0.0.0.0
  port: 8000
  log_level: INFO
  embedding_cache_size: 4096
